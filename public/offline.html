<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f9f9a" />
    <title>StudySize Studio</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        place-items: center;
        margin: 0;
        background: #f7f8fb;
        color: #17202a;
      }

      main {
        max-width: 34rem;
        padding: 2rem;
        text-align: center;
      }

      img {
        width: 72px;
        height: 72px;
        border-radius: 16px;
      }

      p {
        color: #5f6e7f;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>StudySize Studio</h1>
      <p>The app is offline. Reconnect to load the latest calculators and research planning tools.</p>
    </main>
  </body>
</html>
